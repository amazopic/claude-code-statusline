    <rect width="1080" height="140" rx="6" fill="#0E0E10"/>
    <text x="24" y="36" font-family="ui-monospace, monospace" font-size="11" fill="#4A4A48" letter-spacing="3">● ● ●</text>

    <!-- Status line: cyberpunk -->
    <text x="24" y="92" font-family="ui-monospace, 'Geist Mono', monospace" font-size="20" fill="#FF00C8">▌▌▌</text>
    <text x="76" y="92" font-family="ui-monospace, 'Geist Mono', monospace" font-size="20" fill="#00FFFF" font-weight="500">OPUS-4.7-(1M)</text>
    <text x="296" y="92" font-family="ui-monospace, 'Geist Mono', monospace" font-size="20" fill="#FF00C8">▐▐▐</text>
    <text x="350" y="92" font-family="ui-monospace, 'Geist Mono', monospace" font-size="20" fill="#FF8AD9">//</text>
    <text x="380" y="92" font-family="ui-monospace, 'Geist Mono', monospace" font-size="20" fill="#00FFFF">CTX</text>
    <text x="430" y="92" font-family="ui-monospace, 'Geist Mono', monospace" font-size="20" fill="#FF8AD9">:</text>
    <text x="442" y="92" font-family="ui-monospace, 'Geist Mono', monospace" font-size="20" fill="#00FFFF" font-weight="500">12%</text>
    <text x="498" y="92" font-family="ui-monospace, 'Geist Mono', monospace" font-size="20" fill="#FF00C8">▰</text>
    <text x="518" y="92" font-family="ui-monospace, 'Geist Mono', monospace" font-size="20" fill="#262626">▱▱▱▱▱▱▱▱▱</text>
    <text x="700" y="92" font-family="ui-monospace, 'Geist Mono', monospace" font-size="20" fill="#FF8AD9">//</text>
    <text x="730" y="92" font-family="ui-monospace, 'Geist Mono', monospace" font-size="20" fill="#FFFF00">₵RED</text>
    <text x="800" y="92" font-family="ui-monospace, 'Geist Mono', monospace" font-size="20" fill="#FF8AD9">:</text>
    <text x="812" y="92" font-family="ui-monospace, 'Geist Mono', monospace" font-size="20" fill="#FFFF00" font-weight="500">0.42</text>
    <text x="880" y="92" font-family="ui-monospace, 'Geist Mono', monospace" font-size="20" fill="#FF00C8">▐</text>
    <text x="908" y="92" font-family="ui-monospace, 'Geist Mono', monospace" font-size="20" fill="#00FFFF" font-weight="500">JACK-IN</text>

    <text x="24" y="124" font-family="ui-monospace, monospace" font-size="13" fill="#4A4A48" letter-spacing="2">SPECIMEN №11 — CYBERPUNK</text>
  </g>

  <!-- Bottom meta -->
  <line x1="60" y1="600" x2="1140" y2="600" stroke="#0E0E10" stroke-opacity="0.12"/>
  <text x="60" y="595" font-family="ui-monospace, 'Geist Mono', monospace" font-size="13" fill="#4A4A48" letter-spacing="2">
